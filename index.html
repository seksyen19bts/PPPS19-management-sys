<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>PPPS19 Management System</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1220;
    font-family: Arial, Helvetica, sans-serif;
}

/* Main application container */
#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #0b1220;
}

/* Google Apps Script dashboard */
#dashboardFrame {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;
    margin: 0;
    padding: 0;

    display: block;

    background: #0b1220;
}

/* Fullscreen button */
#fullscreenBtn {
    position: fixed;

    right: 15px;
    bottom: 15px;

    z-index: 9999;

    width: 46px;
    height: 46px;

    border: none;
    border-radius: 50%;

    background: rgba(20, 35, 60, 0.92);
    color: white;

    font-size: 20px;

    cursor: pointer;

    box-shadow: 0 4px 15px rgba(0,0,0,.35);

    transition:
        transform .2s ease,
        background .2s ease;
}

#fullscreenBtn:hover {
    background: #2563eb;
    transform: scale(1.05);
}

#fullscreenBtn:active {
    transform: scale(.95);
}

/* Loading screen */
#loading {
    position: fixed;
    inset: 0;

    z-index: 9998;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #0b1220;
    color: white;

    font-size: 16px;
}

.spinner {
    width: 32px;
    height: 32px;

    margin-right: 12px;

    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #3b82f6;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Mobile */
@media (max-width: 768px) {

    #fullscreenBtn {
        width: 42px;
        height: 42px;

        right: 10px;
        bottom: 10px;

        font-size: 18px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <span>Loading PPPS19 Dashboard...</span>
    </div>

    <!-- PPPS19 Google Apps Script -->
    <iframe
        id="dashboardFrame"
        src="https://script.google.com/macros/s/AKfycbz01R8xI7lDuqoRNQpttX2eB2hKAiDcoXZCcso-xUJCmgx2y6wB3sMTq2CkfLu9tHQ/exec"
        title="PPPS19 Management System"
        allow="fullscreen"
        allowfullscreen>
    </iframe>

    <!-- Fullscreen -->
    <button
        id="fullscreenBtn"
        type="button"
        title="Fullscreen">
        ⛶
    </button>

</div>

<script>

const iframe = document.getElementById("dashboardFrame");
const loading = document.getElementById("loading");
const fullscreenBtn = document.getElementById("fullscreenBtn");


/* -----------------------------------------
   Hide loading screen
----------------------------------------- */

iframe.addEventListener("load", function () {

    setTimeout(function () {
        loading.style.display = "none";
    }, 300);

});


/* -----------------------------------------
   Fullscreen
----------------------------------------- */

fullscreenBtn.addEventListener("click", function () {

    const app = document.getElementById("app");

    if (!document.fullscreenElement) {

        if (app.requestFullscreen) {

            app.requestFullscreen();

        } else if (app.webkitRequestFullscreen) {

            app.webkitRequestFullscreen();

        } else if (app.msRequestFullscreen) {

            app.msRequestFullscreen();

        }

    } else {

        if (document.exitFullscreen) {

            document.exitFullscreen();

        }

    }

});


/* -----------------------------------------
   Update fullscreen icon
----------------------------------------- */

document.addEventListener("fullscreenchange", function () {

    if (document.fullscreenElement) {

        fullscreenBtn.innerHTML = "⛶";
        fullscreenBtn.title = "Exit Fullscreen";

    } else {

        fullscreenBtn.innerHTML = "⛶";
        fullscreenBtn.title = "Fullscreen";

    }

});


/* -----------------------------------------
   Prevent accidental page scrolling
----------------------------------------- */

document.addEventListener("touchmove", function(e) {

    if (e.target === document.body) {
        e.preventDefault();
    }

}, { passive: false });


</script>

</body>
</html>
