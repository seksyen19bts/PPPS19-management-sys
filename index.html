<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPPS19</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
        #fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            padding: 12px 24px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        #fullscreen-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbz01R8xI7lDuqoRNQpttX2eB2hKAiDcoXZCcso-xUJCmgx2y6wB3sMTq2CkfLu9tHQ/exec" 
        allowfullscreen="true"
        allow="fullscreen">
    </iframe>

    <script>
        const btn = document.getElementById('fullscreen-btn');
        const iframe = document.querySelector('iframe');

        btn.addEventListener('click', () => {
            iframe.requestFullscreen()
                .then(() => {
                    // Optional: Hide the button once fullscreen is active
                    btn.style.display = 'none';
                })
                .catch((err) => {
                    console.error(`Error enabling full-screen mode: ${err.message}`);
                    alert("Fullscreen blocked. Please check your browser permissions.");
                });
        });

        // Show the button again if the user exits fullscreen
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                btn.style.display = 'block';
            }
        });
    </script>

</body>
</html>
