<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>PPPS19 Management System</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #0b1220;

    font-family: Arial, Helvetica, sans-serif;

    overscroll-behavior: none;
}

/* =========================================
   MAIN APP
========================================= */

#app {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #0b1220;

    overflow: hidden;
}

/* =========================================
   DASHBOARD IFRAME
========================================= */

#dashboardFrame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    display: block;

    background: #0b1220;

    overflow: hidden;

    z-index: 1;
}

/* =========================================
   FULLSCREEN BUTTON
========================================= */

#fullscreenBtn {

    position: fixed;

    right: 15px;
    bottom: 15px;

    z-index: 999999;

    width: 50px;
    height: 50px;

    border: none;

    border-radius: 50%;

    background: rgba(15, 23, 42, 0.95);

    color: #ffffff;

    font-size: 24px;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 15px rgba(0,0,0,.4);

    transition:
        transform .15s ease,
        background .15s ease;

    touch-action: manipulation;

    -webkit-user-select: none;
    user-select: none;

    padding: 0;
}

/* Desktop */

#fullscreenBtn:hover {

    background: #2563eb;

    transform: scale(1.06);
}

#fullscreenBtn:active {

    transform: scale(.92);
}

/* =========================================
   LOADING SCREEN
========================================= */

#loading {

    position: fixed;

    inset: 0;

    z-index: 999998;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    gap: 12px;

    background: #0b1220;

    color: #ffffff;

    font-size: 15px;

    text-align: center;
}

.spinner {

    width: 35px;
    height: 35px;

    border: 3px solid rgba(255,255,255,.2);

    border-top-color: #3b82f6;

    border-radius: 50%;

    animation: spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}

/* =========================================
   FULLSCREEN STATE
========================================= */

#app:fullscreen {

    width: 100vw;
    height: 100vh;

    background: #0b1220;
}

#app:-webkit-full-screen {

    width: 100vw;
    height: 100vh;

    background: #0b1220;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 768px) {

    html,
    body {

        width: 100%;
        height: 100%;

        height: 100dvh;
    }

    #app {

        width: 100vw;
        height: 100dvh;

        min-height: 100dvh;
    }

    #dashboardFrame {

        width: 100vw;

        height: 100dvh;

        min-height: 100dvh;
    }

    #fullscreenBtn {

        width: 44px;
        height: 44px;

        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));

        font-size: 21px;
    }

}

/* =========================================
   VERY SMALL PHONE
========================================= */

@media (max-width: 480px) {

    #fullscreenBtn {

        width: 42px;
        height: 42px;

        right: 10px;

        bottom: calc(10px + env(safe-area-inset-bottom));

        font-size: 20px;
    }

}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================
         LOADING
    ====================================== -->

    <div id="loading">

        <div class="spinner"></div>

        <span>
            Loading PPPS19 Dashboard...
        </span>

    </div>


    <!-- =====================================
         GOOGLE APPS SCRIPT
    ====================================== -->

    <iframe

        id="dashboardFrame"

        src="https://script.google.com/macros/s/AKfycbz01R8xI7lDuqoRNQpttX2eB2hKAiDcoXZCcso-xUJCmgx2y6wB3sMTq2CkfLu9tHQ/exec"

        title="PPPS19 Management System"

        allow="fullscreen"

        allowfullscreen>

    </iframe>


    <!-- =====================================
         FULLSCREEN
    ====================================== -->

    <button

        id="fullscreenBtn"

        type="button"

        aria-label="Fullscreen"

        title="Fullscreen">

        ⛶

    </button>

</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const app =
    document.getElementById("app");

const iframe =
    document.getElementById("dashboardFrame");

const loading =
    document.getElementById("loading");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");


/* =========================================
   LOADING
========================================= */

iframe.addEventListener("load", function () {

    setTimeout(function () {

        loading.style.display = "none";

    }, 300);

});


/* =========================================
   CHECK FULLSCREEN
========================================= */

function isFullscreen() {

    return (

        document.fullscreenElement ||

        document.webkitFullscreenElement ||

        document.msFullscreenElement

    );

}


/* =========================================
   ENTER FULLSCREEN
========================================= */

async function enterFullscreen() {

    try {

        /* Modern browsers */

        if (app.requestFullscreen) {

            await app.requestFullscreen({
                navigationUI: "hide"
            });

            return true;

        }


        /* Safari */

        if (app.webkitRequestFullscreen) {

            app.webkitRequestFullscreen();

            return true;

        }


        /* Older Microsoft */

        if (app.msRequestFullscreen) {

            app.msRequestFullscreen();

            return true;

        }

    }

    catch (error) {

        console.log(
            "Fullscreen not available:",
            error
        );

    }

    return false;

}


/* =========================================
   EXIT FULLSCREEN
========================================= */

async function exitFullscreen() {

    try {

        if (document.exitFullscreen) {

            await document.exitFullscreen();

            return;

        }

        if (document.webkitExitFullscreen) {

            document.webkitExitFullscreen();

            return;

        }

        if (document.msExitFullscreen) {

            document.msExitFullscreen();

            return;

        }

    }

    catch (error) {

        console.log(
            "Exit fullscreen error:",
            error
        );

    }

}


/* =========================================
   FULLSCREEN BUTTON
========================================= */

fullscreenBtn.addEventListener(
    "click",
    async function (event) {

        event.preventDefault();

        event.stopPropagation();


        if (isFullscreen()) {

            await exitFullscreen();

        }

        else {

            await enterFullscreen();

        }

    },
    {
        passive: false
    }
);


/* =========================================
   TOUCH SUPPORT
========================================= */

fullscreenBtn.addEventListener(
    "touchend",
    async function (event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);


/* =========================================
   UPDATE BUTTON
========================================= */

function updateFullscreenButton() {

    if (isFullscreen()) {

        fullscreenBtn.innerHTML = "✕";

        fullscreenBtn.setAttribute(
            "aria-label",
            "Exit Fullscreen"
        );

        fullscreenBtn.setAttribute(
            "title",
            "Exit Fullscreen"
        );

    }

    else {

        fullscreenBtn.innerHTML = "⛶";

        fullscreenBtn.setAttribute(
            "aria-label",
            "Fullscreen"
        );

        fullscreenBtn.setAttribute(
            "title",
            "Fullscreen"
        );

    }

}


/* =========================================
   FULLSCREEN EVENTS
========================================= */

document.addEventListener(
    "fullscreenchange",
    updateFullscreenButton
);

document.addEventListener(
    "webkitfullscreenchange",
    updateFullscreenButton
);

document.addEventListener(
    "MSFullscreenChange",
    updateFullscreenButton
);


/* =========================================
   MOBILE VIEWPORT FIX
========================================= */

function resizeDashboard() {

    const vh =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;

    const vw =
        window.visualViewport
            ? window.visualViewport.width
            : window.innerWidth;


    app.style.width = vw + "px";

    app.style.height = vh + "px";

    iframe.style.width = vw + "px";

    iframe.style.height = vh + "px";

}


/* =========================================
   RESIZE EVENTS
========================================= */

window.addEventListener(
    "resize",
    resizeDashboard
);

window.addEventListener(
    "orientationchange",
    function () {

        setTimeout(
            resizeDashboard,
            300
        );

    }
);


/* =========================================
   VISUAL VIEWPORT
========================================= */

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        resizeDashboard
    );

}


/* =========================================
   INITIALIZE
========================================= */

resizeDashboard();

updateFullscreenButton();


/* =========================================
   PREVENT OUTER PAGE SCROLL
========================================= */

document.addEventListener(
    "touchmove",
    function (event) {

        if (
            event.target === document.body ||
            event.target === app
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);

</script>

</body>
</html>
